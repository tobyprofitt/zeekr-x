[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zeekr-x-tui"
version = "0.1.0"
description = "Terminal dashboard for Zeekr X vehicle status, charging, and trip history"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.23.0,<4",
    "requests>=2.32.5,<3",
    "urllib3>=2,<3",
]

[project.optional-dependencies]
capture = ["mitmproxy==12.2.3"]

[project.scripts]
zeekr-x = "zeekr_x:main"

[tool.setuptools]
packages = ["zeekr_x_api"]
py-modules = ["zeekr_x", "capture_token"]

[tool.setuptools.package-data]
zeekr_x_api = ["LICENSE"]
